version=1.1.0-SNAPSHOT
kestraVersion=2.0.5
# Gradle daemon memory: the defaults (512 MiB heap / 384 MiB metaspace) run out while resolving the Kestra 2.x
# test classpath on CI ("Java heap space" in :compileTestJava).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
