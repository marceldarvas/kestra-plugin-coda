name: CI

# Self-contained CI for Kestra 2.x plugins (Java 25).
#
# Replaces the shared kestra-io/actions plugins.yml workflow:
# - on private repositories it runs on `kestra-private-4cpu-4gb`, a runner that only exists in the
#   kestra-io organization, so jobs stayed queued until GitHub cancelled them;
# - its publish/indexing steps only run for kestra-io/* repositories anyway.
# No scheduled trigger: GitHub disables workflows whose cron runs on an inactive repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup - Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup - Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check
        run: ./gradlew check

      - name: Build - Shadow jar
        run: ./gradlew shadowJar

      - name: Upload - Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: Upload - Plugin jar
        uses: actions/upload-artifact@v6
        with:
          name: plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
