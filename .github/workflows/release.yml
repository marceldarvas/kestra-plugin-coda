name: Release Plugin

# Self-contained release for Kestra 2.x (Java 25).
#
# The shared kestra-io/actions plugin-release action can't be used here:
# - it installs Java 21, which can't compile a Java 25 target;
# - it needs kestra-io GitHub App inputs (gh-app-id / gh-app-private-key);
# - its release.sh is currently hard-disabled upstream ("temporarily disabled", exit 1).
#
# What this workflow does:
# 1. Runs the tests.
# 2. Runs the gradle-release plugin. It commits the release version, tags v<releaseVersion>,
#    and commits the next -SNAPSHOT version on main.
# 3. Builds the shadow jar from the tag and attaches it to a GitHub Release.
#    That jar is what you drop into Kestra's plugins directory.
#
# Maven Central publishing is intentionally not wired up: the project group is
# `io.kestra.plugin`, a Maven Central namespace owned by Kestra.
#
# If main is branch-protected against GITHUB_TOKEN pushes, add a GH_PERSONAL_TOKEN secret
# (contents: write on this repository). The workflow uses it when present.

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version, e.g. 1.2.0"
        required: true
      nextVersion:
        description: "Next development version (default: next patch, e.g. 1.2.1-SNAPSHOT)"
        required: false
      dryRun:
        description: "Build and test only; no commits, tag or GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.releaseVersion }}
      NEXT_VERSION_INPUT: ${{ inputs.nextVersion }}
      DRY_RUN: ${{ inputs.dryRun }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PERSONAL_TOKEN || github.token }}

      - name: Setup - Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup - Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate inputs
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Releases must run from main (gradle-release requireBranch), got '$GITHUB_REF_NAME'"; exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::releaseVersion must be X.Y.Z, got '$RELEASE_VERSION'"; exit 1
          fi
          NEXT_VERSION="$NEXT_VERSION_INPUT"
          if [[ -z "$NEXT_VERSION" ]]; then
            IFS='.' read -r MAJ MIN PATCH <<< "$RELEASE_VERSION"
            NEXT_VERSION="${MAJ}.${MIN}.$((PATCH + 1))-SNAPSHOT"
          fi
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::nextVersion must be X.Y.Z-SNAPSHOT, got '$NEXT_VERSION'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "::error::Tag v${RELEASE_VERSION} already exists"; exit 1
          fi
          echo "next=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${RELEASE_VERSION}, next ${NEXT_VERSION}, dryRun=${DRY_RUN}"

      - name: Test
        run: ./gradlew check

      - name: Release - Tag and bump version
        if: ${{ !inputs.dryRun }}
        env:
          NEXT_VERSION: ${{ steps.versions.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./gradlew release \
            -Prelease.useAutomaticVersion=true \
            -Prelease.releaseVersion="${RELEASE_VERSION}" \
            -Prelease.newVersion="${NEXT_VERSION}"

      - name: Build - Shadow jar
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" ]]; then
            git checkout "v${RELEASE_VERSION}"
          fi
          ./gradlew clean shadowJar
          ls -l build/libs

      - name: Publish - GitHub Release
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${RELEASE_VERSION}" build/libs/*.jar \
            --verify-tag \
            --title "v${RELEASE_VERSION}" \
            --generate-notes

      - name: Upload - Dry-run jar
        if: ${{ inputs.dryRun }}
        uses: actions/upload-artifact@v6
        with:
          name: plugin-jar-dry-run
          path: build/libs/*.jar
          if-no-files-found: error
